name: Travel Planner CD

on:
  workflow_run:
    workflows:
      - "Travel Planner CI"
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout tested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: composer:2.10.3
          coverage: none

      - name: Install Production Dependencies
        run: |
          composer install \
            --no-dev \
            --no-ansi \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader

      - name: Prepare Deployment
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf tests
          rm -rf node_modules

      - name: Push Build to Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Deploy Travel Planner ${{ github.event.workflow_run.head_sha }}"

          git branch -M deployment

          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git push --force origin deployment