name: Travel Planner CD

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: travel-planner-deployment
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout tested code
        uses: actions/checkout@v5

      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/travel-planner" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Smoke test production image
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: bash .github/scripts/smoke-image.sh

      - name: Create application archive
        env:
          APP_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: bash .github/scripts/package.sh

      - name: Upload application archive
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: travel-planner-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image and update deployment branch
        env:
          APP_IMAGE_NAME: ${{ steps.image.outputs.name }}
          ARCHIVE_URL: ${{ steps.archive.outputs.artifact-url }}
        run: bash .github/scripts/publish.sh
