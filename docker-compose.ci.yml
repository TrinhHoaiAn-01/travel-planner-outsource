services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing

    container_name: travel-planner-ci-app

    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: travel_planner
      DB_USERNAME: root
      DB_PASSWORD: root@admin

    depends_on:
      mysql:
        condition: service_healthy

    # The CI workflow runs migrations before tests; keep startup migration-free
    # so two migration processes cannot race against the same database.
    command: apache2-foreground

  mysql:
    image: mysql:8.4

    container_name: travel-planner-ci-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root@admin
      MYSQL_DATABASE: travel_planner

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot@admin"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
