services:
  app:
    build:
      context: .
      target: testing
    image: travel-planner-commerce:local
    container_name: travel-planner-app
    ports:
      - "8080:80"
    pull_policy: never
    environment:
      COMMERCE_AGENTS_ENABLED: "true"
      COMMERCE_AGENTS_PYTHON: /opt/commerce-venv/bin/python
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      COMMERCE_AGENT_PROVIDER: ${COMMERCE_AGENT_PROVIDER:-openai}
      COMMERCE_SOLR_URL: http://solr:8983/solr/ai_chatbot
      SEARCH_SOLR_URL: http://solr:8983/solr/travel_planner
      SESSION_DRIVER: file
      CACHE_STORE: database
    volumes:
      - ./app:/var/www/html/app
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./database:/var/www/html/database
      - ./public:/var/www/html/public
      - ./tests:/var/www/html/tests
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./.env:/var/www/html/.env
      - ./plugins/commerce-agents:/var/www/html/plugins/commerce-agents:ro
    depends_on:
      solr:
        condition: service_started

  solr:
    image: solr:9
    command:
      - bash
      - -c
      - precreate-core ai_chatbot /opt/commerce-solr && precreate-core travel_planner /opt/website-solr && exec solr-foreground
    ports:
      - "127.0.0.1:8983:8983"
    volumes:
      - commerce_solr_data:/var/solr
      - ./deploy/solr:/opt/commerce-solr:ro
      - ./deploy/solr-search:/opt/website-solr:ro
      - ./deploy/solr/web.xml:/opt/solr/server/solr-webapp/webapp/WEB-INF/web.xml:ro

volumes:
  commerce_solr_data:
